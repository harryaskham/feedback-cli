name: CI

# Build + test via Nix, which provides ALL toolchains (nothing required on the
# runner image beyond Nix + flakes). The only ecosystem dependency, mcp-cli, is
# a PUBLIC repo fetched over HTTPS, so this needs no SSH key, deploy key, or
# token — it builds as-is on a secretless runner.
#
# Runs on GitHub-hosted ubuntu-latest with Determinate Nix (public repository:
# GitHub-hosted minutes are free here, and the fleet's self-hosted runners never
# serve public repositories, where fork pull requests could run code). Nix
# builds sandboxed there, so pure `nix build` / `nix flake check` work as
# before.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: nix build + flake check
    runs-on: ubuntu-latest
    # Cold-cache `nix build` + `nix flake check` on a freshly-provisioned node
    # can exceed the old 30m budget; tendril uses the same 60m on this pool.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Verify Nix is available
        shell: bash
        run: nix --version

      - name: Build the library
        shell: bash
        run: nix build .#feedback-cli --no-write-lock-file

      - name: Run flake checks (build + unit + doc tests)
        shell: bash
        run: nix flake check --no-write-lock-file
