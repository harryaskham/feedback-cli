name: CI

# Build + test via Nix, which provides ALL toolchains (nothing required on the
# runner image beyond Nix + flakes). The only ecosystem dependency, mcp-cli, is
# a PUBLIC repo fetched over HTTPS, so this needs no SSH key, deploy key, or
# token — it builds as-is on a secretless runner.
#
# Runs on feedback-cli's own repo-scoped persistent NixOS runners (label set
# [self-hosted, nix, x86_64-linux] = feedback-cli-ms-dev{,-2..-6}/pocket4), NOT
# the shared azure-ephemeral pool (bd-26bdac): this repo has ZERO runners
# carrying the `azure-ephemeral` label, so every job targeting it sat unassigned
# until the 24h queue timeout auto-cancelled it. Persistent NixOS boxes also run
# Nix sandboxed by default, which the azure-ephemeral image does not (tendril
# bd-acf75f), so pure `nix build` / `nix flake check` is a better fit here.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: nix build + flake check
    runs-on: [self-hosted, nix, x86_64-linux]
    # Cold-cache `nix build` + `nix flake check` on a freshly-provisioned node
    # can exceed the old 30m budget; tendril uses the same 60m on this pool.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify Nix is available
        shell: bash
        run: nix --version

      - name: Build the library
        shell: bash
        run: nix build .#feedback-cli --no-write-lock-file

      - name: Run flake checks (build + unit + doc tests)
        shell: bash
        run: nix flake check --no-write-lock-file
